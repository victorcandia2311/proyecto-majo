server {
    listen 80;
    server_name localhost;

    # Laravel siempre sirve desde /public, NUNCA desde la raíz
    root /var/www/html/public;

    index index.php;

    charset utf-8;
    client_max_body_size 20M;

    # Rutas principales: si el archivo no existe, se pasa por index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Procesamiento de PHP a través del contenedor "app"
    location ~ .php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Bloquear archivos ocultos (.env, .git, etc.)
    location ~ /.(?!well-known).* {
        deny all;
    }
}