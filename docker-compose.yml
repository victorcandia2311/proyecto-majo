version: '3.8'

services:
  # ============================================
  # SERVICIO 1: NGINX (Servidor Web)
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: laravel_nginx
    restart: unless-stopped
    ports:
      - "8080:80"   # Puerto 8080 en el host → 80 dentro del contenedor
                    # (No choca con tu NestJS en 3000/3001)
    volumes:
      - ./:/var/www/html                        # Monta todo el código del proyecto
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf  # Configuración de Nginx
    depends_on:
      - app
    networks:
      - laravel_network

  # ============================================
  # SERVICIO 2: APP (PHP-FPM + Laravel)
  # ============================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html            # Monta tu código (controladores, vistas, .env, etc.)
      - /var/www/html/vendor        # ← TRUCO: protege el vendor instalado por el Dockerfile
    depends_on:
      - db
    networks:
      - laravel_network

  # ============================================
  # SERVICIO 3: BASE DE DATOS (PostgreSQL 17.2)
  # ============================================
  db:
    image: postgres:17.2
    container_name: laravel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: majo             # Nombre de la BD (igual que tu .env local)
      POSTGRES_USER: postgres       # Usuario (igual que tu .env local)
      POSTGRES_PASSWORD: postgres   # Contraseña (igual que tu .env local)
    ports:
      - "5432:5432"                 # Puerto expuesto (por si necesitas conectarte desde fuera)
    volumes:
      - pgdata:/var/lib/postgresql/data  # Volumen persistente para los datos
    networks:
      - laravel_network

# ============================================
# VOLÚMENES PERSISTENTES
# ============================================
volumes:
  pgdata:   # Los datos de PostgreSQL sobreviven aunque reinicies el contenedor

# ============================================
# REDES
# ============================================
networks:
  laravel_network:
    driver: bridge   # Red interna para que los 3 servicios se comuniquen entre sí